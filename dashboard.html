<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Incidencias</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <h2>📊 Dashboard de Incidencias Técnicas</h2>
    <div class="grid">
        <div class="card"><canvas id="chartEquip"></canvas></div>
        <div class="card"><canvas id="chartUbic"></canvas></div>
    </div>
    <script>
        new Chart(document.getElementById('chartEquip'), {
            type: 'bar',
            data: {
                labels: ['Pizarra electrónica', 'Monitor', 'Ordenador', 'Teclado', 'Ratón'],
                datasets: [{ label: 'Equipamiento Afectado', data: [663, 628, 615, 615, 585], backgroundColor: '#3498db' }]
            }
        });
        new Chart(document.getElementById('chartUbic'), {
            type: 'pie',
            data: {
                labels: ['Aula 202', 'AulaInformática 1', 'Laboratorio 2', 'Clase 101', 'Clase 108'],
                datasets: [{ data: [108, 91, 90, 87, 86], backgroundColor: ['#2ecc71','#e74c3c','#f1c40f','#9b59b6','#34495e'] }]
            }
        });
    </script>
</body>
</html>
